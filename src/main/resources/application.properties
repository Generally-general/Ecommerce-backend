spring.application.name=project

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ShopSphere;encrypt=true;trustServerCertificate=true
spring.datasource.username=spring_user
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.myProject.demo=DEBUG

jwt.secret=mySuperSecretKeyForJwtSigning123456
jwt.expiration=3600000
jwt.refresh-expiration=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
